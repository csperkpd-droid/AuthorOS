name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: authoros
          POSTGRES_PASSWORD: authoros
          POSTGRES_DB: authoros
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U authoros"
          --health-interval 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://authoros:authoros@localhost:5432/authoros
      TEST_DATABASE_URL: postgresql://authoros:authoros@localhost:5432/authoros_test
      AUTH_SECRET: ci-only-not-a-real-secret
      EMAIL_TRANSPORT: outbox

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Create test database
        run: PGPASSWORD=authoros psql -h localhost -U authoros -d authoros -c "CREATE DATABASE authoros_test"

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:deploy
      - run: pnpm test
      - run: pnpm build

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
