# Local development database. Production uses Neon via the Vercel integration.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: authoros
      POSTGRES_PASSWORD: authoros
      POSTGRES_DB: authoros
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/docker-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authoros"]
      interval: 5s
      retries: 10

volumes:
  postgres-data:
